[project]
name = "superclean"
version = "0.6.0"
description = "A universal CLI tool to clean development caches and reclaim disk space."
authors = [{ name = "Nguyen Huy", email = "nguyenhuy158@gmail.com" }]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "shellingham>=1.5.0",
    "psutil>=5.9.0",
    "questionary>=2.0.0",
]
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
tui = [
    "textual>=0.89.0",
]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "textual>=0.89.0",
]

[project.scripts]
sclean = "superclean.main:app"
superclean = "superclean.main:app"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
